[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Jarvis voice agent — LiveKit pipeline with SpatialReal avatar"
requires-python = ">=3.10,<3.15"

dependencies = [
    # Versions alignées sur livekit-plugins-spatialreal (dernière version PyPI : 1.4.5)
    "livekit-agents==1.4.5",
    "livekit-api>=1.1.0",
    "livekit-plugins-silero==1.4.5",
    "livekit-plugins-anthropic==1.4.5",
    "livekit-plugins-deepgram==1.4.5",
    "livekit-plugins-cartesia==1.4.5",
    # Plugin officiel SpatialReal — publié sur PyPI (PR #5014 livekit/agents)
    "livekit-plugins-spatialreal==1.4.5",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = []
